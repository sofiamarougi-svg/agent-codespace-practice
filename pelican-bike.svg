<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450">
  <!-- Sky background -->
  <rect width="500" height="450" fill="#e8f4f8"/>

  <!-- Ground -->
  <rect x="0" y="380" width="500" height="70" fill="#8db58f"/>
  <rect x="0" y="375" width="500" height="10" fill="#6b8e3a"/>

  <!-- === BICYCLE === -->

  <!-- Rear wheel -->
  <circle cx="150" cy="350" r="45" fill="none" stroke="#444" stroke-width="4"/>
  <circle cx="150" cy="350" r="4" fill="#666"/>
  <line x1="150" y1="305" x2="150" y2="395" stroke="#888" stroke-width="1.5"/>
  <line x1="105" y1="350" x2="195" y2="350" stroke="#888" stroke-width="1.5"/>
  <line x1="118" y1="318" x2="182" y2="382" stroke="#888" stroke-width="1.5"/>
  <line x1="118" y1="382" x2="182" y2="318" stroke="#888" stroke-width="1.5"/>

  <!-- Front wheel -->
  <circle cx="340" cy="350" r="45" fill="none" stroke="#444" stroke-width="4"/>
  <circle cx="340" cy="350" r="4" fill="#666"/>
  <line x1="340" y1="305" x2="340" y2="395" stroke="#888" stroke-width="1.5"/>
  <line x1="295" y1="350" x2="385" y2="350" stroke="#888" stroke-width="1.5"/>
  <line x1="308" y1="318" x2="372" y2="382" stroke="#888" stroke-width="1.5"/>
  <line x1="308" y1="382" x2="372" y2="318" stroke="#888" stroke-width="1.5"/>

  <!-- Bike frame -->
  <line x1="195" y1="305" x2="150" y2="350" stroke="#c0392b" stroke-width="5"/>
  <line x1="195" y1="305" x2="280" y2="305" stroke="#c0392b" stroke-width="5"/>
  <line x1="280" y1="305" x2="150" y2="350" stroke="#c0392b" stroke-width="5"/>

  <!-- Seat post -->
  <line x1="195" y1="305" x2="195" y2="290" stroke="#555" stroke-width="4"/>
  <!-- Seat -->
  <ellipse cx="195" cy="284" rx="22" ry="8" fill="#333"/>

  <!-- Handlebar stem -->
  <line x1="280" y1="305" x2="285" y2="270" stroke="#555" stroke-width="4"/>
  <!-- Handlebars -->
  <path d="M 265 270 Q 285 260 305 270" fill="none" stroke="#555" stroke-width="4"/>
  <circle cx="265" cy="270" r="4" fill="#222"/>
  <circle cx="305" cy="270" r="4" fill="#222"/>

  <!-- Fork -->
  <line x1="280" y1="305" x2="340" y2="350" stroke="#c0392b" stroke-width="5"/>

  <!-- Bottom bracket / chainring -->
  <circle cx="150" cy="350" r="6" fill="#c0392b"/>
  <circle cx="150" cy="350" r="12" fill="none" stroke="#555" stroke-width="2"/>

  <!-- Crank arm and pedal -->
  <line x1="150" y1="350" x2="130" y2="370" stroke="#555" stroke-width="3"/>
  <rect x="122" y="368" width="16" height="6" fill="#444" rx="2"/>

  <!-- === PELICAN BODY === -->
  <ellipse cx="215" cy="255" rx="48" ry="35" fill="#f5f5dc" transform="rotate(-8 215 255)"/>

  <!-- Tail feathers -->
  <path d="M 170 265 Q 140 250 125 235" fill="none" stroke="#d4c9a8" stroke-width="3"/>
  <path d="M 170 265 Q 145 258 130 245" fill="none" stroke="#d4c9a8" stroke-width="3"/>
  <path d="M 175 270 Q 150 262 140 255" fill="none" stroke="#d4c9a8" stroke-width="3"/>

  <!-- Back wing -->
  <path d="M 190 240 Q 215 225 245 235 Q 230 245 200 265" fill="#e8dcc8" stroke="#d4c9a8" stroke-width="2"/>

  <!-- Neck -->
  <path d="M 240 240 Q 260 218 280 198" fill="none" stroke="#f5f5dc" stroke-width="22"/>
  <path d="M 238 245 Q 258 222 278 205" fill="none" stroke="#f5f5dc" stroke-width="18"/>

  <!-- Head -->
  <ellipse cx="282" cy="188" rx="28" ry="24" fill="#f5f5dc"/>

  <!-- Eye -->
  <circle cx="292" cy="180" r="7" fill="white"/>
  <circle cx="294" cy="180" r="4" fill="#222"/>
  <circle cx="295" cy="178" r="1.5" fill="white"/>

  <!-- Beak (the big pelican beak!) -->
  <path d="M 302 188 L 335 188 L 330 212 L 308 218 Z" fill="#f4a460" stroke="#c8651e" stroke-width="2"/>
  <line x1="302" y1="186" x2="335" y2="186" stroke="#c8651e" stroke-width="2.5"/>
  <path d="M 308 194 Q 328 206 322 222 Q 312 220 302 208" fill="#e8a050" stroke="none"/>
  <path d="M 335 186 Q 337 194 332 200" fill="none" stroke="#c8651e" stroke-width="2"/>

  <!-- Head tuft -->
  <path d="M 267 170 Q 272 157 278 160" fill="none" stroke="#d4c9a8" stroke-width="2.5"/>
  <path d="M 270 174 Q 275 162 280 165" fill="none" stroke="#d4c9a8" stroke-width="2.5"/>

  <!-- Front wing (gripping handlebar) -->
  <path d="M 245 248 Q 265 240 275 258 Q 285 252 295 262 Q 300 266 305 270" fill="#e8dcc8" stroke="#d4c9a8" stroke-width="2"/>
  <ellipse cx="303" cy="270" rx="6" ry="4" fill="#e8dcc8" stroke="#d4c9a8" stroke-width="1.5"/>

  <!-- Legs -->
  <!-- Back leg to pedal -->
  <line x1="200" y1="282" x2="180" y2="330" stroke="#e8a050" stroke-width="5"/>
  <line x1="180" y1="330" x2="135" y2="370" stroke="#e8a050" stroke-width="4"/>
  <path d="M 125 366 L 140 366 L 140 358 L 120 374 Z" fill="#e8a050"/>

  <!-- Front leg reaching toward front of frame -->
  <line x1="225" y1="282" x2="245" y2="320" stroke="#e8a050" stroke-width="5"/>
  <line x1="245" y1="320" x2="265" y2="345" stroke="#e8a050" stroke-width="4"/>
  <path d="M 258 342 L 272 342 L 272 334 L 255 348 Z" fill="#e8a050"/>

  <!-- Motion lines -->
  <line x1="85" y1="300" x2="100" y2="300" stroke="#888" stroke-width="2" opacity="0.4"/>
  <line x1="80" y1="335" x2="100" y2="335" stroke="#888" stroke-width="2" opacity="0.4"/>
  <line x1="75" y1="370" x2="95" y2="370" stroke="#888" stroke-width="2" opacity="0.3"/>
  <line x1="90" y1="245" x2="105" y2="245" stroke="#888" stroke-width="2" opacity="0.3"/>

  <!-- Sun -->
  <circle cx="430" cy="65" r="35" fill="#f9d71c"/>
  <circle cx="430" cy="65" r="28" fill="#f7c94b"/>
  <line x1="430" y1="65" x2="460" y2="35" stroke="#f9d71c" stroke-width="3" opacity="0.3"/>
  <line x1="430" y1="65" x2="400" y2="35" stroke="#f9d71c" stroke-width="3" opacity="0.3"/>
  <line x1="430" y1="65" x2="460" y2="95" stroke="#f9d71c" stroke-width="3" opacity="0.3"/>
  <line x1="430" y1="65" x2="400" y2="95" stroke="#f9d71c" stroke-width="3" opacity="0.3"/>

  <!-- Clouds -->
  <g opacity="0.7" fill="white">
    <ellipse cx="80" cy="55" rx="40" ry="18"/>
    <ellipse cx="50" cy="50" rx="30" ry="15"/>
    <ellipse cx="120" cy="60" rx="25" ry="12"/>
  </g>
  <g opacity="0.5" fill="white">
    <ellipse cx="320" cy="45" rx="35" ry="15"/>
    <ellipse cx="290" cy="40" rx="25" ry="12"/>
  </g>
</svg>